services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tack}
      POSTGRES_USER: ${POSTGRES_USER:-tack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - tack_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      NODE_ENV: production
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-tack}
      PGUSER: ${POSTGRES_USER:-tack}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000}
      TACK_ADMIN_EMAIL: ${TACK_ADMIN_EMAIL:?Set TACK_ADMIN_EMAIL in .env}
      TACK_ADMIN_PASSWORD: ${TACK_ADMIN_PASSWORD:?Set TACK_ADMIN_PASSWORD in .env}
      TACK_ADMIN_NAME: ${TACK_ADMIN_NAME:-Tack Admin}
      TACK_ADMIN_COLOR: ${TACK_ADMIN_COLOR:-rust}
      TACK_AUTH_DEFAULT: ${TACK_AUTH_DEFAULT:-local}
      TACK_OIDC_PROVIDERS: ${TACK_OIDC_PROVIDERS:-[]}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      COGNITO_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET:-}
      COGNITO_NAME: ${COGNITO_NAME:-Amazon Cognito}
      COGNITO_ALLOW_SIGN_UP: ${COGNITO_ALLOW_SIGN_UP:-false}
    ports:
      - "${TACK_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  tack_postgres_data:
