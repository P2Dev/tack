name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tack_tests
          POSTGRES_USER: tack
          POSTGRES_PASSWORD: tack-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U tack -d tack_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: true
      TEST_DATABASE_URL: postgresql://tack:tack-test-only@127.0.0.1:5432/tack_tests
      E2E_DATABASE_URL: postgresql://tack:tack-test-only@127.0.0.1:5432/tack_tests
      E2E_PORT: 3157
      BETTER_AUTH_SECRET: ci-only-auth-secret-longer-than-thirty-two-characters
      BETTER_AUTH_URL: http://127.0.0.1:3157
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm docs:build && pnpm docs:check && pnpm docs:verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-reports
          path: |
            playwright-report/
            test-results/
            .site/verification/
          retention-days: 7
